<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { background: #333; color: white; font-family: sans-serif; }
    img { max-width: 800px; border: 2px solid red; margin-bottom: 20px; }
  </style>

  <!-- Responsive Core Styles -->
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }
    html, body {
      max-width: 100vw !important;
      overflow-x: hidden !important;
      margin: 0;
      padding: 0;
    }
    img, video {
      max-width: 100%;
      height: auto;
    }
    @media (max-width: 768px) {
      .hero-films, .hero-main, .hero-section, .hero-overlay {
        padding-top: 140px !important;
        min-height: auto !important;
      }
      #sliderContainer .card {
        min-width: 100% !important;
        max-width: 100% !important;
      }
      .services-container .service-card {
        min-width: 100% !important;
        max-width: 100% !important;
      }
      .brands-grid {
        grid-template-columns: repeat(2, 1fr) !important;
        gap: 15px !important;
      }
    }
    @media (max-width: 480px) {
      .brands-grid {
        grid-template-columns: repeat(2, 1fr) !important;
        gap: 10px !important;
      }
    }
  </style>

</head>
<body>
  <h2>images/Hero_Section_Image/image.png</h2>
  <img src="images/Hero_Section_Image/image.png">
  
  <h2>images/hero_new-2026.png</h2>
  <img src="images/hero_new-2026.png">

  <h2>images/FINAL_HERO_IMAGE .png</h2>
  <img src="images/FINAL_HERO_IMAGE .png">
</body>
</html>
